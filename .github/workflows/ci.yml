name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Import check
        run: python -c "from app.main import app; print(app.title, app.version)"

      - name: Unit tests (offline)
        run: python -m pytest -q -p no:warnings -m "not live"

  frontend:
    name: Frontend (React + TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  # Builds the standalone native Android app into an installable debug APK.
  # Skipped on pull requests to keep PR feedback fast; runs on main pushes and
  # manual dispatch.
  android:
    name: Android APK (Native)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NRNMUSIC_APPLICATION_ID: com.nrnmusic.app
      NRNMUSIC_APP_NAME: NrNMusic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Use the latest Android SDK platform available on the GitHub runner.
      - name: Install Android SDK platform 36
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          echo "using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36"

      - name: Assemble debug APK
        working-directory: native-android
        run: ./gradlew :app:assembleFossDebug --no-daemon

      - name: Name the artifact
        run: cp native-android/app/build/outputs/apk/universalFoss/debug/app-universal-foss-debug.apk "NrNMusic-debug-${GITHUB_SHA:0:7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NrNMusic-debug-apk
          path: NrNMusic-debug-*.apk
          retention-days: 14
          if-no-files-found: error

  # Real browser + real YouTube Music. Runs on manual dispatch only, because it
  # depends on external network availability; push/PR CI stays hermetic.
  e2e:
    name: E2E smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run E2E smoke test
        env:
          NRN_CHROME: google-chrome
        run: python scripts/e2e_smoke.py

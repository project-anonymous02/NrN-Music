name: One-time NrNMusic identity migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nrnmusic-rebrand-once.yml

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename Android package and product identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          root = Path("native-android")
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          protected = {"native-android/LICENSE", "native-android/FORK_NOTICE.md"}

          for rel in tracked:
              if not rel or not rel.startswith("native-android/") or rel in protected:
                  continue
              path = Path(rel)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              sentinels = {
                  "com.metrolist.innertubex": "__EXTERNAL_INNERTUBEX_PACKAGE__",
                  "MetrolistGroup": "__UPSTREAM_GROUP__",
                  "metrolist.cc": "__LEGACY_METROLIST_DOMAIN__",
              }
              for old, token in sentinels.items():
                  text = text.replace(old, token)

              new_rel = rel.replace("metrolist_strings.xml", "nrnmusic_strings.xml")
              lines = text.splitlines(keepends=True)
              for index, line in enumerate(lines):
                  if 'name="wrapped_special_thanks"' in line and new_rel != "native-android/app/src/main/res/values/nrnmusic_strings.xml":
                      continue
                  if "Metrolist Project" in line or ("Copyright" in line and "Metrolist" in line):
                      lines[index] = line.replace("Metrolist", "__UPSTREAM_COPYRIGHT_WORD__")
              text = "".join(lines)

              text = text.replace("com.metrolist.", "com.nrnmusic.")
              text = text.replace("METROLIST_", "NRNMUSIC_")
              text = text.replace("MetrolistWidgetManager", "NrNMusicWidgetManager")
              text = text.replace("Metrolist", "NrNMusic")
              text = text.replace("metrolist", "nrnmusic")
              text = text.replace("METROLIST", "NRNMUSIC")
              text = text.replace("__EXTERNAL_INNERTUBEX_PACKAGE__", "com.metrolist.innertubex")
              text = text.replace("__UPSTREAM_GROUP__", "MetrolistGroup")
              text = text.replace("__LEGACY_NRNMUSIC_DOMAIN__", "metrolist.cc")
              text = text.replace("__UPSTREAM_COPYRIGHT_WORD__", "Metrolist")
              text = text.replace(
                  "https://github.com/MetrolistGroup/NrNMusic/releases",
                  "https://github.com/project-anonymous02/NrN-Music/releases",
              )
              text = text.replace(
                  "https://github.com/MetrolistGroup/NrNMusic",
                  "https://github.com/project-anonymous02/NrN-Music",
              )

              if path.name == "shortcuts.xml":
                  text = text.replace(
                      'android:targetPackage="com.nrnmusic.music"',
                      'android:targetPackage="com.nrnmusic.app"',
                  )

              if new_rel == "native-android/app/src/main/res/values/nrnmusic_strings.xml":
                  text = text.replace(
                      "Special thanks to MO Agamy for creating NrNMusic",
                      "Special thanks to MO Agamy, creator of the original Metrolist project",
                  )
                  text = text.replace(
                      "NrNMusic includes open-source components from NrNMusic and other projects. Portions derived from NrNMusic are licensed under GPL-3.0; see the license for details.",
                      "NrNMusic includes open-source components from the original Metrolist project and other projects. Portions derived from Metrolist are licensed under GPL-3.0; see the license for details.",
                  )

              if text != path.read_text(encoding="utf-8"):
                  path.write_text(text, encoding="utf-8")

          # Rename the source filename, translated resource files, and Kotlin package directories.
          for path in list(root.rglob("MetrolistWidgetManager.kt")):
              path.rename(path.with_name("NrNMusicWidgetManager.kt"))

          for path in list(root.rglob("metrolist_strings.xml")):
              path.rename(path.with_name("nrnmusic_strings.xml"))

          for source_root in (root / "app/src", root / "innertube/src"):
              package_dirs = sorted(
                  (p for p in source_root.rglob("metrolist") if p.is_dir() and p.parent.name == "com"),
                  key=lambda p: len(p.parts),
                  reverse=True,
              )
              for path in package_dirs:
                  target = path.with_name("nrnmusic")
                  if target.exists():
                      for child in list(path.iterdir()):
                          destination = target / child.name
                          if destination.exists():
                              raise RuntimeError(f"Package migration collision: {destination}")
                          child.rename(destination)
                      path.rmdir()
                  else:
                      path.rename(target)

          notice = """# NrNMusic Android fork notice

          The Android application and the `:innertube` module in this directory are derived from Metrolist.

          - Upstream project: <https://github.com/MetrolistGroup/Metrolist>
          - Upstream revision: `76fa5a78b5110674442884b6f21c0cef51cdb782` (2026-10-11)
          - License: GNU GPL version 3.0; see [`LICENSE`](LICENSE).
          - Fork maintainer and NrNMusic product identity: Nata / NrNMusic.
          - Upstream stream library: [InnerTubeX](https://github.com/MetrolistGroup/innertubex), version `v0.8.4`, also GPL-3.0.

          NrNMusic changes include the Android application ID (`com.nrnmusic.app`), Android namespace (`com.nrnmusic.music`), internal package namespace migration (`com.nrnmusic.*`), display name, launcher icon resources, release destination text, and Android build workflow. Upstream source headers, copyright notices, author attribution, and GPL-3.0 licensing are retained. The package and product identity changes do not transfer upstream authorship or alter the original license. The original React/FastAPI web implementation remains outside this Android module and is not part of the native APK build.

          This fork is not affiliated with, endorsed by, or sponsored by YouTube, Google, or the Metrolist maintainers. YouTube and Google may change the undocumented InnerTube protocol, so remote catalog or playback availability is not guaranteed. The Android app does not require a NrNMusic account or NrNMusic backend; some optional upstream account features remain in the app and may require the user's service account.

          When distributing the Android APK, provide the corresponding source and GPL-3.0 notices to recipients as required by the license.
          """
          (root / "FORK_NOTICE.md").write_text(notice, encoding="utf-8")

          # Static validation only. Do not invoke Gradle or build the application.
          app_gradle = (root / "app/build.gradle.kts").read_text()
          inner_gradle = (root / "innertube/build.gradle.kts").read_text()
          assert 'namespace = "com.nrnmusic.music"' in app_gradle
          assert 'namespace = "com.nrnmusic.innertube"' in inner_gradle
          assert 'com.nrnmusic.app' in app_gradle
          assert "NRNMUSIC_BUILD_COMMIT" in app_gradle

          xml_count = 0
          for xml in (root / "app/src").rglob("*.xml"):
              ET.parse(xml)
              xml_count += 1

          for source_root in (root / "app/src", root / "innertube/src"):
              if list(source_root.rglob("com/metrolist")):
                  raise RuntimeError(f"Old source package directory remains under {source_root}")

          for path in root.rglob("*"):
              if not path.is_file() or any(part in {".git", ".gradle", "build"} for part in path.parts):
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if re.search(r"com\.metrolist\.(?!innertubex)", content):
                  raise RuntimeError(f"Old first-party package reference remains in {path}")
              if "METROLIST_" in content:
                  raise RuntimeError(f"Old build environment variable remains in {path}")

          print(f"Static identity validation passed. Parsed {xml_count} XML files.")

          # Retain upstream copyright and license attribution; remove only the temporary migration workflow.
          Path(".github/workflows/nrnmusic-rebrand-once.yml").unlink()
          PY

      - name: Commit and push identity migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A native-android .github/workflows/nrnmusic-rebrand-once.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: rebrand Android package and updater for NrNMusic"
          git push origin HEAD:main
